<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabletop Haven | Home</title>
  <meta name="description" content="Discover, explore, and review your favorite board games and tabletop adventures at Tabletop Haven.">
  <meta name="author" content="Innocent Nkuah">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Tabletop Haven | Board Games & Tabletop Gaming">
  <meta property="og:description" content="Discover and explore tabletop board games with dynamic filtering, reviews, and detailed stats.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/hero-boardgames.webp">

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">

  <!-- Stylesheets & Scripts -->
  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="scripts/main.js"></script>
</head>
<body>

  <!-- Header & Wayfinding Navigation -->
  <header>
    <div class="brand">
      <img src="images/tabletop.webp" alt="Tabletop Haven Logo" class="logo" width="50" height="50">
      <h1>Tabletop Haven</h1>
    </div>
    
    <button id="hamburger-menu" aria-label="Toggle Navigation Menu">
      <span>&#9776;</span>
    </button>

    <nav id="primary-nav">
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="explore.html">Explore Games</a></li>
        <li><a href="checkout.html">Reserve Game</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero & Main Content -->
  <main>
    <section class="hero">
      <div class="hero-content">
        <h2>Your Ultimate Tabletop Gaming Hub</h2>
        <p>Find your next game night hit, filter by play style, and explore detailed stats!</p>
      </div>
      <img src="images/hero_board_game.webp" alt="Tabletop board games set up on a wooden table" class="hero-img" loading="lazy">
    </section>

    <!-- Dynamic Content Container (Populated by JavaScript API/JSON fetch) -->
    <section class="featured-games">
      <h2>Featured Tabletop Games</h2>
      
      <!-- Controls for JS filter/search -->
      <div class="filter-controls">
        <label for="category-filter">Category:</label>
        <select id="category-filter">
          <option value="all">All Categories</option>
          <option value="strategy">Strategy</option>
          <option value="cooperative">Co-op</option>
          <option value="party">Party</option>
        </select>
      </div>

      <!-- JavaScript will dynamically inject 15+ game cards here -->
      <div id="game-cards-container" class="grid-container"></div>
    </section>

    <!-- Modal Dialog structure for game detail popups -->
    <dialog id="game-modal">
      <button id="close-modal" aria-label="Close dialog">&times;</button>
      <div id="modal-content">
        <!-- Dynamic game detail content inserted here via JavaScript -->
      </div>
    </dialog>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; <span id="current-year"></span> Tabletop Haven | Innocent Nkuah</p>
    <p><a href="attributions.html">Attributions</a></p>
    <p><a href="https://youtube.com" target="_blank" rel="noopener">Project Video Demonstration</a></p>
  </footer>

</body>
</html>
