<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Games | Tabletop Haven</title>
  <meta name="description" content="Search and filter board games by category or player count from Tabletop Haven library.">
  <meta name="author" content="Innocent Nkuah">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  
  <meta property="og:title" content="Explore Games - Tabletop Haven">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/hero-bg.webp">
  <meta property="og:url" content="https://yourusername.github.io/wdd231/final/explore.html">

  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="scripts/explore.js"></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="images/tabletop.webp" alt="Tabletop Haven Logo" width="50" height="50">
      <h1>Tabletop Haven</h1>
    </div>
    <button id="hamburger-btn" aria-label="Toggle navigation menu">&#9776;</button>
    <nav id="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html" class="active">Explore Library</a></li>
        <li><a href="checkout.html">Reserve Game</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Board Game Collection</h2>
    
    <!-- Controls Section: Search & Filters -->
    <section class="controls">
      <input type="text" id="search-input" placeholder="Search game title...">
      
      <select id="category-filter">
        <option value="all">All Categories</option>
        <option value="Strategy">Strategy</option>
        <option value="Family">Family</option>
        <option value="Cooperative">Cooperative</option>
        <option value="Party">Party</option>
      </select>

      <button id="view-toggle">Toggle Grid View</button>
    </section>

    <!-- Dynamic Game Grid -->
    <section id="game-grid" class="card-grid">
      <!-- Generated via JS -->
    </section>

    <!-- Modal Dialog for Game Details -->
    <dialog id="game-dialog">
      <div class="dialog-content">
        <button id="close-dialog" aria-label="Close dialog">&times;</button>
        <div id="dialog-body"></div>
      </div>
    </dialog>
  </main>

  <footer>
    <p>&copy; <span id="current-year"></span> Tabletop Haven | Innocent nkuah | WDD 231</p>
    <p><a href="https://youtube/YOUR_VIDEO_ID" target="_blank" rel="noopener">Project Video Demonstration</a></p>
  </footer>
</body>
</html>
