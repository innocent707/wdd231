<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve Game | Tabletop Haven</title>
  <meta name="description" content="Reserve a game from Tabletop Haven library.">
  <meta name="author" content="Innocent Nkuah">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="scripts/main.js"></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="images/tabletop.webp" alt="Tabletop Haven Logo" width="50" height="50">
      <h1>Tabletop Haven</h1>
    </div>
    <button id="hamburger-btn" aria-label="Toggle navigation menu">&#9776;</button>
    <nav id="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore Library</a></li>
        <li><a href="checkout.html" class="active">Reserve Game</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Reserve a Board Game</h2>
    <form action="thankyou.html" method="get" class="reservation-form">
      <label for="fname">First Name *</label>
      <input type="text" id="fname" name="fname" required>

      <label for="lname">Last Name *</label>
      <input type="text" id="lname" name="lname" required>

      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required>

      <label for="game-select">Select Game *</label>
      <select id="game-select" name="game" required>
        <option value="">-- Choose a Game --</option>
        <option value="Catan">Catan</option>
        <option value="Ticket to Ride">Ticket to Ride</option>
        <option value="Pandemic">Pandemic</option>
        <option value="Codenames">Codenames</option>
        <option value="Wingspan">Wingspan</option>
      </select>

      <label for="pickup-date">Pickup Date *</label>
      <input type="date" id="pickup-date" name="pickupDate" required>

      <label for="comments">Notes / Special Requests</label>
      <textarea id="comments" name="comments" rows="4"></textarea>

      <input type="submit" value="Confirm Reservation" class="cta-btn">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="current-year"></span> Tabletop Haven | Innocent Nkuah | WDD 231</p>
    <p><a href="https://youtube/YOUR_VIDEO_ID" target="_blank" rel="noopener">Project Video Demonstration</a></p>
  </footer>
</body>
</html>
